<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SRS Formalization Agent{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar-brand {
            font-weight: 700;
        }
        .sidebar {
            background-color: #ffffff;
            border-right: 1px solid #dee2e6;
            height: calc(100vh - 56px);
            overflow-y: auto;
        }
        .content-area {
            height: calc(100vh - 56px);
            overflow-y: auto;
            background-color: #fafbfc;
        }
        .requirement-card {
            border-left: 4px solid #0d6efd;
            background-color: #eef5ff;
            margin-bottom: 1rem;
            padding: 1rem;
            border-radius: 0.375rem;
        }
        .requirement-highlight {
            background-color: #fff3cd;
            border-bottom: 2px solid #ffc107;
            padding: 2px 4px;
            font-weight: 500;
        }
        .section-tree-item {
            display: block;
            padding: 0.375rem 0.75rem;
            color: #495057;
            text-decoration: none;
            border-radius: 0.25rem;
            font-size: 0.9rem;
        }
        .section-tree-item:hover {
            background-color: #e9ecef;
            color: #0f5132;
        }
        .section-tree-item.active {
            background-color: #d1e7dd;
            color: #0f5132;
            font-weight: 600;
        }
        .badge-reqs {
            background-color: #6c757d;
            font-size: 0.75rem;
        }
        .active .badge-reqs {
            background-color: #198754;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-diagram-3-fill me-2"></i>SRS Formalization Agent
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="bi bi-house-door-fill me-1"></i>Dashboard</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container-fluid">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
